name: Machine gates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      formats: ${{ steps.capabilities.outputs.formats }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Detect format implementation on this branch
        id: capabilities
        run: |
          python -c "import os; from pathlib import Path; output = Path(os.environ['GITHUB_OUTPUT']); output.write_text('formats=' + str(Path('scripts/gates/verify_formats.py').exists()).lower() + '\n', encoding='utf-8')"
      - name: Install pinned Hugo extended
        shell: bash
        run: |
          set -euo pipefail
          version=0.167.0
          archive="hugo_extended_${version}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${version}"
          curl --fail --location --output "$archive" "$base/$archive"
          echo "0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build previews and run all gates and mutation checks
        run: python scripts/gates/verify.py
      - name: Check every built page in a browser
        run: python scripts/gates/browser_evidence.py
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-evidence
          path: |
            .cache/evidence/
            .cache/test-public/
            .cache/preview-public/
            public/
          include-hidden-files: true
  formats:
    needs: gates
    if: needs.gates.outputs.formats == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install PDF tools for this CI job only
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --only-binary=:all: --require-hashes -r .github/workflows/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate-evidence
          path: .
      - name: Build PDFs, run G12 and mutation-check every format control
        run: python scripts/gates/verify_formats.py
      - name: Render print evidence for visual review
        run: pdftoppm -png -r 110 .cache/test-public/playbooks/test-page/print.pdf .cache/evidence/print
      - name: Capture every page and print format in a browser
        run: python scripts/gates/browser_evidence.py
      - name: Retain format evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: format-evidence
          path: |
            .cache/evidence/
            .cache/test-public/
            .cache/preview-public/
            public/
          include-hidden-files: true
