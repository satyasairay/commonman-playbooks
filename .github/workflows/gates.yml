name: Machine gates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Hugo extended
        shell: bash
        run: |
          set -euo pipefail
          version=0.167.0
          archive="hugo_extended_${version}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${version}"
          curl --fail --location --output "$archive" "$base/$archive"
          curl --fail --location --output checksums.txt "$base/hugo_${version}_checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Build previews and run all gates and mutation checks
        run: python scripts/gates/verify.py
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence
          path: |
            .cache/evidence/
            .cache/test-public/
          include-hidden-files: true
